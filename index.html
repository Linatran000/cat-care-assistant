<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cat Care Assistant</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-container">
    <!-- Onboarding View -->
    <section id="onboarding-view" class="view active">
      <div class="onboarding-content">
        <div class="branding">
          <i class="fa-solid fa-cat brand-icon"></i>
          <h1>Cat Care<br>Assistant</h1>
          <p>Chăm sóc linh hoạt, mèo bớt stress.</p>
        </div>
        <form id="onboarding-form">
          <div class="input-group">
            <label for="cat-name">Tên bé mèo</label>
            <input type="text" id="cat-name" placeholder="Mimi..." required>
          </div>
          <div class="input-group">
            <label for="cat-breed">Giống mèo</label>
            <input type="text" id="cat-breed" placeholder="Anh lông ngắn..." required>
          </div>
          <div class="row">
            <div class="input-group">
              <label for="cat-age">Tuổi (tháng)</label>
              <input type="number" id="cat-age" placeholder="12" min="1" required>
            </div>
            <div class="input-group">
              <label for="cat-weight">Nặng (kg)</label>
              <input type="number" id="cat-weight" placeholder="4.5" step="0.1" min="0.1" required>
            </div>
          </div>
          <button type="submit" class="btn-primary" id="btn-start">Bắt đầu <i class="fa-solid fa-arrow-right"></i></button>
        </form>
      </div>
    </section>
    <!-- Dashboard View -->
    <section id="dashboard-view" class="view">
      <header class="dashboard-header">
        <div class="user-greeting">
          <h2>Chào buổi sáng,</h2>
          <h3 id="display-cat-name">Mimi đang chờ bạn</h3>
        </div>
        <div class="avatar-circle">
          <i class="fa-solid fa-cat"></i>
        </div>
      </header>
      <!-- Behavior Tracker -->
      <div class="behavior-section card-glass">
        <h4>Trạng thái của mèo ngay lúc này</h4>
        <div class="mood-selector" id="mood-selector">
          <button class="mood-btn" data-mood="calm"><span>😊</span> Bình tĩnh</button>
          <button class="mood-btn" data-mood="alert"><span>😐</span> Cảnh giác</button>
          <button class="mood-btn" data-mood="avoidant"><span>🙈</span> Trốn tránh</button>
          <button class="mood-btn" data-mood="fearful"><span>⚠️</span> Sợ hãi</button>
        </div>
      </div>
      <!-- Task List -->
      <div class="tasks-section">
        <div class="task-header">
          <h4>Việc cần làm hôm nay</h4>
          <span class="task-count" id="task-count">0/0</span>
        </div>
        <div class="task-list" id="task-list">
          <!-- Tasks dynamically rendered here from JS -->
        </div>
      </div>
    </section>
    
    <!-- Toast Container for Notifications -->
    <div id="toast-container"></div>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
